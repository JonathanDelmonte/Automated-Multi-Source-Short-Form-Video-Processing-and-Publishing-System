<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <!-- O V da marca Virtu Clips: na aba, a logo inteira seria um borrão de
       16 px. Desenhado por ajudante/marca.py, como o ícone do instalador. -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070707" />
  <meta name="color-scheme" content="dark" />

  <!-- Fontes: Anton nos títulos (a letra do CLIPS da logo) · Geist no corpo ·
       JetBrains Mono nos rótulos. Servidas desta origem, e não de
       fonts.googleapis.com: uma folha de estilo hospedada no Google manda o IP
       de todo visitante a um processador nos EUA antes de a página renderizar.
       Ver public/fonts.css para como os subsets foram gerados. -->
  <link rel="stylesheet" href="/fonts.css" />

  <!-- Sem meta de SEO, Open Graph, canonical, JSON-LD ou robots (ADR-009).
       Isto é uma ferramenta self-hosted que atende em localhost: não há
       rastreador para indexar, e o que havia aqui descrevia e apontava para o
       produto comercial do upstream. -->
  <title>Virtu Clips</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
