# Sobreposicao para maquina com GPU NVIDIA. Nao substitui o docker-compose.yml:
# soma-se a ele.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# **Por que e arquivo separado, e nao um bloco no compose principal.** O
# `reservations.devices` abaixo e uma exigencia, nao uma preferencia: numa
# maquina sem GPU (ou com o NVIDIA Container Toolkit ausente) o `up` falha em
# vez de cair para CPU. Juntar isso ao arquivo padrao quebraria o caminho que
# funciona para todo mundo em nome do que funciona para quem tem placa.
#
# Antes de usar, a imagem precisa das libs de CUDA, que nao entram por padrao
# porque somam ~2 GB:
#
#   docker compose build --build-arg GPU=1 backend
#
# No Windows ainda e preciso ter o driver NVIDIA com suporte a WSL 2 (o driver
# normal ja traz desde 2021) -- nao se instala driver dentro do WSL.
#
# Conferir que funcionou, depois de subir:
#
#   docker compose exec backend python diagnostico.py
#
# A linha `placa p/ o whisper` responde. `nao` significa que a placa nao chegou
# ao container, e nesse caso o `WHISPER_DEVICE=cuda` abaixo cai para CPU sozinho
# (`transcribe_backends._whisper_force_cpu`) -- ou seja, funciona, so que lento,
# que e o pior modo de falhar: sem erro.
#
# A pergunta e feita ao `ctranslate2`, e nao ao `torch` como este comentario
# mandava ate 16-set-2026: quem o faster-whisper usa e o ctranslate2, e sao
# bibliotecas diferentes com exigencias diferentes de CUDA/cuDNN. Um `True` do
# torch com a transcricao rodando em CPU e a falha silenciosa disfarcada de
# conferencia feita.

services:
  backend:
    # **A imagem sai com as libs de CUDA sempre que este arquivo esta junto**
    # (22-set-2026). Antes o `GPU=1` so existia na linha de comando do
    # reconstruir-gpu.bat; o reconstruir.bat -- que o atualizar.bat manda rodar
    # quando uma dependencia muda -- construia SEM ele, e a placa sumia de vez:
    # so 40 minutos de reconstruir-gpu.bat a devolviam. Com o argumento aqui,
    # qualquer `build` que leve este arquivo constroi certo.
    #
    # Nao provoca recriacao sozinho: o compose tira o `build` do hash que
    # decide se o container precisa ser recriado.
    build:
      context: .
      args:
        GPU: "1"
    environment:
      # `large-v3-turbo` so faz sentido com GPU; em CPU ele e proibitivo.
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-float16}
      # **Esta linha faltava, e o buraco era grande** (16-set-2026). Este
      # arquivo existe para dizer "esta maquina tem placa NVIDIA", e ate aqui
      # ele dizia isso so para a transcricao: todo encode continuava em libx264,
      # na CPU. E nao e um encode por corte -- a cadeia e corte -> reenquadra ->
      # [marca] -> [gancho] -> legenda, tres a cinco encodes do MESMO clipe, os
      # dois primeiros a `-crf 18`. Numa maquina com placa, isso e o segundo
      # bloco de tempo do job inteiro rodando no lugar errado.
      #
      # `auto` e nao `nvenc` de proposito: o `ffmpeg_utils` sonda uma sessao
      # h264_nvenc de verdade e cai para libx264 sozinho quando ela nao abre
      # (driver velho, VRAM cheia, sessoes simultaneas esgotadas). Com `nvenc`
      # o fallback tambem acontece, mas depois de uma linha de aviso por job.
      FFMPEG_ENCODER: ${FFMPEG_ENCODER:-auto}
      # **Sem `CLIP_WORKERS` aqui, de proposito** (23-set-2026). A placa nao
      # muda quantos cortes cabem ao mesmo tempo, e isto foi MEDIDO: com 6 no
      # lugar dos 3 do `main.py`, na maquina do autor (RTX 3060, 16 threads),
      # o ffmpeg do reenquadramento andou a 98 quadros/s SOMADOS, contra ~155
      # com 3 -- cada corte a 14-18 q/s, contra 46-61. Mais cortes juntos
      # disputaram a mesma maquina e fizeram menos no total: o render do job
      # custou ~45 s a mais. Subir de novo so com uma medicao que mostre a soma
      # crescer; as linhas `⏱️ corte N` do log sao essa medicao.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
