name: Windows

# O motor fora do Docker, no Windows (ajudante, Fase 6.2, 24-set-2026).
#
# O CI de sempre (ci.yml) roda no Linux e, de proposito, sem torch, mediapipe
# nem whisper. Este roda o motor INTEIRO no Windows, e publica o ajudante:
#
# - `motor`: as dependencias direto no Python do runner, a suite de testes, e
#   um video do comeco ao fim (ajudante/ponta_a_ponta.py): fala gerada pelo
#   proprio Windows, whisper em CPU, deteccao por um LLM falso, corte,
#   reenquadramento e legenda. Depois cancela um job no meio e apaga o
#   projeto -- no Windows, um ffmpeg orfao seguraria o arquivo.
# - `instalador`: monta o Instalar-Virtu-Clips.exe, instala SEM janela como
#   um amigo instalaria, confere que o motor instalado sobe e processa o mesmo
#   video, testa a atualizacao sozinha (uma versao boa entra; uma quebrada
#   volta e nao e tentada de novo), desinstala conferindo que os projetos
#   ficam -- e instala de novo como USUARIO COMUM, o caso que falhou no PC do
#   autor e que o runner, administrador, nunca via.
# - `publicar`: com os dois verdes, poe o instalador no GitHub Releases --
#   de onde o site o oferece e de onde os ajudantes instalados se atualizam.
#   So quando o MOTOR mudou: um commit de documentacao ou do painel nao
#   obriga ninguem a reiniciar nada.
#
# O que nenhum prova: placa de video, download do YouTube e IA de verdade.
# Esses ficam para o teste no PC do autor (docs/COMO-EXECUTAR.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma volta por vez, na ordem dos envios: duas publicando juntas poderiam
# deixar como "a mais nova" a versao mais velha.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  motor:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ffmpeg do Chocolatey (o build "essentials" do gyan.dev, com libass e
      # libx264). O instalador leva o mesmo.
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Dependencias do motor
        id: deps
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r ajudante/requirements-windows.txt pytest
      - name: Versoes
        run: |
          ffmpeg -hide_banner -version | Select-Object -First 1
          python -c "import torch, mediapipe, faster_whisper, ctranslate2; print('torch', torch.__version__, '| mediapipe', mediapipe.__version__, '| ctranslate2', ctranslate2.__version__)"
      # Pasta curta de proposito: o checkout aqui mora num caminho de ~180
      # caracteres, e a libass abre a legenda com o `fopen` de 260 do Windows.
      # Na maquina de quem instala o caminho tem ~130.
      - name: Um video do comeco ao fim
        run: python ajudante/ponta_a_ponta.py --pasta "$env:RUNNER_TEMP\e2e"
      # Roda mesmo com o video vermelho: os dois sinais sao independentes, e
      # saber so de um deles numa volta de 15 minutos custa a volta seguinte.
      - name: Testes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pytest tests/ -q -p no:cacheprovider
      - name: Guardar o que falhou
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: motor-log
          path: ${{ runner.temp }}/e2e/motor.log
          if-no-files-found: ignore

  instalador:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      # O historico inteiro (so os commits, sem os arquivos antigos): a versao
      # e a contagem de commits da main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Versao
        id: versao
        run: |
          $v = (git rev-list --count HEAD).Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT
          "VERSAO=$v" >> $env:GITHUB_ENV
          "versao $v"
      - name: O que o instalador leva
        run: |
          choco install ffmpeg innosetup -y --no-progress
          python -m pip install --upgrade pip uv pillow
          New-Item -ItemType Directory -Force binarios | Out-Null
          $ff = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName binarios\
          Copy-Item (Join-Path $ff.DirectoryName "ffprobe.exe") binarios\
          Copy-Item (python -c "import uv; print(uv.find_uv_bin())") binarios\uv.exe
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath binarios
          # O Python do motor vai DENTRO do instalador (ver instalar.ps1): o
          # CPython standalone que o uv instalaria, copiado da pasta concreta
          # -- e nao do atalho de versao menor que o uv cria ao lado dela.
          $env:UV_PYTHON_INSTALL_DIR = "$env:RUNNER_TEMP\py"
          python -m uv python install 3.11
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $py = Get-ChildItem $env:UV_PYTHON_INSTALL_DIR -Directory -Filter "cpython-3.11.*-windows-x86_64-none" |
                Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } | Select-Object -First 1
          if (-not $py) { "o uv nao deixou um Python 3.11 em $env:UV_PYTHON_INSTALL_DIR"; exit 1 }
          Copy-Item $py.FullName binarios\python -Recurse
          & binarios\python\python.exe -c "import sys, ssl, sqlite3, ctypes, venv; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem binarios | Format-Table Name, Length
      - name: Empacotar
        run: python ajudante/empacotar.py --versao $env:VERSAO --bin binarios --python binarios\python --commit "${{ github.sha }}"
      - name: Compilar o instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=$env:VERSAO" ajudante\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem ajudante\saida | Format-Table Name, Length
      # Antes, uma instalacao do tempo em que o programa se chamava Cortes
      # (%LOCALAPPDATA%\Cortes): o instalador novo tem de trazer os projetos
      # para a pasta nova e levar o resto -- programa e atalho.
      - name: Instalar sem janela
        run: |
          $antiga = "$env:LOCALAPPDATA\Cortes"
          New-Item -ItemType Directory -Force "$antiga\versoes\527\ajudante", "$antiga\dados\output\projeto" | Out-Null
          Set-Content "$antiga\iniciar.py" "# o iniciar.py de uma instalacao antiga"
          Set-Content "$antiga\dados\output\projeto\corte.txt" "um corte de antes da marca nova"
          New-Item -ItemType File -Force "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Cortes.lnk" | Out-Null
          $p = Start-Process ajudante\saida\Instalar-Virtu-Clips.exe -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$env:RUNNER_TEMP\inno.log"
          "codigo do instalador: $($p.ExitCode)"
          Get-Content "$env:LOCALAPPDATA\VirtuClips\dados\logs\instalacao.log" -Tail 60 -ErrorAction SilentlyContinue
          Select-String -Path "$env:RUNNER_TEMP\inno.log" -Pattern "RedirectionGuard|Cortes" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
      # O atalho, o menu Iniciar e o "iniciar com o Windows" chamam o
      # pythonw.exe do venv com o iniciar.py; se um dos dois faltar, o icone
      # nao faz nada.
      - name: Atalhos, inicio com o Windows e a pasta antiga
        run: |
          $base = "$env:LOCALAPPDATA\VirtuClips"
          foreach ($f in "venv\Scripts\python.exe", "venv\Scripts\pythonw.exe", "python\python.exe", "iniciar.py", "atual.txt", "bin\ffmpeg.exe", "bin\deno.exe", "versoes\$env:VERSAO\VERSAO", "versoes\$env:VERSAO\.completo", "virtu-clips.ico") {
            if (-not (Test-Path (Join-Path $base $f))) { "faltou $f"; exit 1 }
          }
          $atual = (Get-Content "$base\atual.txt").Trim()
          if ($atual -ne $env:VERSAO) { "atual.txt diz $atual, e nao $env:VERSAO"; exit 1 }
          # O valor manteve o nome de antes da marca (ajudante.VALOR_NO_INICIO).
          $run = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name Cortes).Cortes
          "inicia com o Windows: $run"
          if ($run -notmatch "VirtuClips\\venv\\Scripts\\pythonw\.exe" -or $run -notmatch "iniciar\.py") { exit 1 }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          if (-not (Test-Path "$menu\Virtu Clips.lnk")) { "faltou o atalho do menu Iniciar"; exit 1 }
          # A instalacao antiga: os projetos vieram, o resto saiu.
          if (-not (Test-Path "$base\dados\output\projeto\corte.txt")) { "os projetos da pasta Cortes nao vieram"; exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\Cortes") { "a pasta Cortes ficou:"; Get-ChildItem -Recurse "$env:LOCALAPPDATA\Cortes"; exit 1 }
          if (Test-Path "$menu\Cortes.lnk") { "o atalho antigo ficou"; exit 1 }
          "versao instalada: $atual"
      - name: O motor instalado sobe
        run: |
          & "$env:LOCALAPPDATA\VirtuClips\venv\Scripts\python.exe" "$env:LOCALAPPDATA\VirtuClips\iniciar.py" --verificar
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: O motor instalado processa um video
        run: |
          $env:PATH = "$env:LOCALAPPDATA\VirtuClips\bin;" + $env:PATH
          & "$env:LOCALAPPDATA\VirtuClips\venv\Scripts\python.exe" "$env:LOCALAPPDATA\VirtuClips\versoes\$env:VERSAO\ajudante\ponta_a_ponta.py" --pasta "$env:RUNNER_TEMP\e2e"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # A atualizacao sozinha, contra um servidor local com o formato das URLs
      # do GitHub Releases. Duas versoes: uma boa, que muda as dependencias
      # (para o `instalar.ps1 -SoDependencias` rodar de verdade), e uma com o
      # app.py quebrado, que tem de VOLTAR -- e nao ser tentada de novo.
      - name: A atualizacao troca a versao boa e devolve a quebrada
        run: |
          $base = "$env:LOCALAPPDATA\VirtuClips"
          $py = "$base\venv\Scripts\python.exe"
          $srv = "$env:RUNNER_TEMP\releases"
          function Publicar($versao) {
            python ajudante/empacotar.py --versao $versao --bin binarios --sem-icone `
              --pacote "$env:RUNNER_TEMP\pacote-$versao" --saida "$env:RUNNER_TEMP\saida-$versao" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "empacotar $versao" }
            New-Item -ItemType Directory -Force "$srv\latest\download", "$srv\download\ajudante-$versao" | Out-Null
            Copy-Item "$env:RUNNER_TEMP\saida-$versao\motor.zip" "$srv\download\ajudante-$versao\"
            Copy-Item "$env:RUNNER_TEMP\saida-$versao\versao.json" "$srv\latest\download\" -Force
          }
          # `| Out-Host`: sem ele, a saida do python viraria parte do valor
          # que a funcao devolve, e o `-ne 0` compararia uma lista de linhas.
          function Atualizar {
            & $py "$base\iniciar.py" --atualizar-agora | Out-Host
            return $LASTEXITCODE
          }
          $boa, $quebrada = "$env:VERSAO.1", "$env:VERSAO.2"
          Add-Content ajudante\requirements-windows.txt "# muda a assinatura das dependencias"
          Publicar $boa
          git checkout -- ajudante/requirements-windows.txt
          Set-Content app.py 'raise SystemExit("app.py quebrado de proposito pelo CI")'
          Publicar $quebrada
          git checkout -- app.py
          New-Item -ItemType Directory -Force "$srv\latest\download" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\saida-$boa\versao.json" "$srv\latest\download\" -Force
          $servidor = Start-Process python -ArgumentList "-m", "http.server", "8131", "--bind", "127.0.0.1", "--directory", $srv -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $env:CORTES_ATUALIZACAO_URL = "http://127.0.0.1:8131"
          try {
            "== versao boa ($boa)"
            if ((Atualizar) -ne 0) { "a versao boa nao entrou"; exit 1 }
            $atual = (Get-Content "$base\atual.txt").Trim()
            if ($atual -ne $boa) { "atual.txt diz $atual depois da troca"; exit 1 }
            if (-not (Test-Path "$base\versoes\$env:VERSAO")) { "a versao anterior tinha de ficar"; exit 1 }

            "== versao quebrada ($quebrada)"
            Copy-Item "$env:RUNNER_TEMP\saida-$quebrada\versao.json" "$srv\latest\download\" -Force
            if ((Atualizar) -eq 0) { "a versao quebrada foi aceita"; exit 1 }
            $atual = (Get-Content "$base\atual.txt").Trim()
            if ($atual -ne $boa) { "a versao quebrada virou a atual ($atual)"; exit 1 }
            if (Test-Path "$base\versoes\$quebrada") { "a pasta da versao quebrada ficou"; exit 1 }
            $estado = Get-Content "$base\dados\atualizacao.json" | ConvertFrom-Json
            if ($estado.falhou -notcontains $quebrada) { "a falha nao foi registrada"; exit 1 }

            "== a quebrada nao e tentada de novo"
            if ((Atualizar) -ne 0) { exit 1 }
            if (-not (Select-String -Path "$base\dados\logs\atualizacao.log" -Pattern "ja falhou" -Quiet)) { "tentou de novo"; exit 1 }

            "== o motor da versao nova sobe pelo iniciar.py"
            & $py "$base\iniciar.py" --verificar
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Stop-Process -Id $servidor.Id -Force -ErrorAction SilentlyContinue
            "---- dados\logs\atualizacao.log"
            Get-Content "$base\dados\logs\atualizacao.log" -Tail 80 -ErrorAction SilentlyContinue
          }
      - name: Desinstalar leva o programa e deixa os projetos
        run: |
          $base = "$env:LOCALAPPDATA\VirtuClips"
          & "$base\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          # O desinstalador se copia para o temporario e segue de la: espera
          # pelo efeito, nao pelo processo. E pelo ULTIMO efeito -- ele apaga
          # a si mesmo no fim; o venv, com milhares de arquivos, ainda estava
          # sendo apagado quando a pasta das versoes ja tinha sumido.
          $fim = (Get-Date).AddSeconds(300)
          while ((Test-Path "$base\unins000.exe") -and ((Get-Date) -lt $fim)) { Start-Sleep 2 }
          if (Test-Path "$base\unins000.exe") { "o desinstalador nao terminou"; exit 1 }
          if (Test-Path "$base\versoes") { "o motor ficou para tras"; exit 1 }
          if (Test-Path "$base\venv") { "o venv ficou para tras"; exit 1 }
          if (Test-Path "$base\python") { "o Python ficou para tras"; exit 1 }
          if (-not (Test-Path "$base\dados")) { "os projetos sumiram"; exit 1 }
          if (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name Cortes -ErrorAction SilentlyContinue) { "o inicio com o Windows ficou"; exit 1 }
          "desinstalado; os projetos ficaram em $base\dados"
      # O caso que falhou no PC do autor (24-set-2026): uma pessoa COMUM, sem
      # administrador, instalando. O runner do GitHub e administrador, e atalho
      # de pasta criado por administrador e "confiavel" para a RedirectionGuard
      # -- por isso a volta de cima nunca viu o erro 448. Aqui o instalador roda
      # como um usuario comum, e com a RedirectionGuard FORCADA
      # (/REDIRECTIONGUARD): o motor tem de instalar mesmo com ela ligada. A
      # linha "protecao de redirecionamento" do registro diz se ela chegou ao
      # powershell -- e a resposta que o autor precisava.
      - name: Um usuario comum instala
        run: |
          # 14 caracteres, nao mais: acima disso o `net user` pergunta se pode
          # continuar, e esperaria um "S" para sempre.
          $senha = "Vc-" + [guid]::NewGuid().ToString("N").Substring(0, 8) + "-a1"
          net user amigo $senha /add | Out-Null
          if ($LASTEXITCODE -ne 0) { "nao criou o usuario"; exit 1 }
          $cred = New-Object System.Management.Automation.PSCredential("amigo", (ConvertTo-SecureString $senha -AsPlainText -Force))
          Set-Service seclogon -StartupType Manual
          Start-Service seclogon
          $pub = "C:\Users\Public\vc"
          New-Item -ItemType Directory -Force $pub | Out-Null
          icacls $pub /grant "amigo:(OI)(CI)M" | Out-Null
          Copy-Item ajudante\saida\Instalar-Virtu-Clips.exe $pub
          $p = Start-Process "$pub\Instalar-Virtu-Clips.exe" -Credential $cred -LoadUserProfile -Wait -PassThru `
               -WorkingDirectory $pub `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/REDIRECTIONGUARD", "/LOG=$pub\inno-amigo.log"
          "codigo do instalador (usuario comum): $($p.ExitCode)"
          $base = "C:\Users\amigo\AppData\Local\VirtuClips"
          Get-Content "$base\dados\logs\instalacao.log" -Tail 40 -ErrorAction SilentlyContinue
          Select-String -Path "$pub\inno-amigo.log" -Pattern "RedirectionGuard" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          $v = Start-Process "$base\venv\Scripts\python.exe" -Credential $cred -LoadUserProfile -Wait -PassThru `
               -WorkingDirectory $base -ArgumentList "$base\iniciar.py", "--verificar" `
               -RedirectStandardOutput "$pub\verificar.txt" -RedirectStandardError "$pub\verificar-erro.txt"
          Get-Content "$pub\verificar.txt", "$pub\verificar-erro.txt" -ErrorAction SilentlyContinue
          if ($v.ExitCode -ne 0) { "o motor do usuario comum nao subiu"; exit 1 }
      - name: Guardar o instalador
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Instalar-Virtu-Clips
          path: |
            ajudante/saida/Instalar-Virtu-Clips.exe
            ajudante/saida/motor.zip
            ajudante/saida/versao.json
          if-no-files-found: ignore
      # Numa pasta so: o upload-artifact recusa caminhos sem uma raiz comum
      # (o temporario do runner e o AppData da pessoa).
      - name: Juntar os registros
        if: ${{ failure() }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\registros" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\inno.log", "$env:RUNNER_TEMP\e2e\motor.log" "$env:RUNNER_TEMP\registros\" -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\VirtuClips\dados\logs\*.log" "$env:RUNNER_TEMP\registros\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Users\Public\vc\*.log", "C:\Users\Public\vc\*.txt" "$env:RUNNER_TEMP\registros\" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\registros\amigo" | Out-Null
          Copy-Item "C:\Users\amigo\AppData\Local\VirtuClips\dados\logs\*.log" "$env:RUNNER_TEMP\registros\amigo\" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:RUNNER_TEMP\registros"
      - name: Guardar o que falhou
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: instalador-logs
          path: ${{ runner.temp }}/registros
          if-no-files-found: ignore

  publicar:
    needs: [motor, instalador]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITULO_DO_COMMIT: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Instalar-Virtu-Clips
          path: novo
      # So a PONTA da main publica. A release cria a tag no commit desta
      # volta, e o GitHub trata uma tag num commit cujo .github/workflows
      # difere do da main como "criar workflow" -- exige `workflows: write`,
      # que o GITHUB_TOKEN nunca tem, e responde 403 "Resource not accessible
      # by integration" (24-set-2026, medido: o cabecalho da resposta aceita
      # `contents=write` OU `contents=write,workflows=write`). Com um commit
      # mais novo na main, a volta DELE publica -- e as versoes saem em ordem.
      - name: Publicar se o motor mudou
        run: |
          set -euo pipefail
          ponta=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$ponta" != "$GITHUB_SHA" ]; then
            echo "a main ja esta em ${ponta::7}: a volta dela publica"
            exit 0
          fi
          ls -l novo
          versao=$(jq -r .versao novo/versao.json)
          conteudo=$(jq -r .conteudo novo/versao.json)
          if gh release download --pattern versao.json --dir anterior 2>/dev/null; then
            anterior=$(jq -r .versao anterior/versao.json)
            if [ "$(jq -r .conteudo anterior/versao.json)" = "$conteudo" ]; then
              echo "o motor e o mesmo da versao $anterior: nada a publicar"
              exit 0
            fi
            if [ "$anterior" -ge "$versao" ]; then
              echo "a versao $anterior ja publicada e mais nova que a $versao: nada a publicar"
              exit 0
            fi
          fi
          # A primeira linha sem pipe: com pipefail, o `head` fechando o cano
          # cedo mataria o printf de uma mensagem longa (SIGPIPE).
          titulo="${TITULO_DO_COMMIT%%$'\n'*}"
          notas=$(printf 'Motor do commit %s: %s\n\nBaixe o **Instalar-Virtu-Clips.exe** e abra; ele instala o motor (sem Docker, sem administrador) e abre o site. Quem ja tem o Virtu Clips recebe esta versao sozinho.\n' "${GITHUB_SHA::7}" "$titulo")
          if ! gh release create "ajudante-$versao" novo/Instalar-Virtu-Clips.exe novo/motor.zip novo/versao.json \
               --title "Virtu Clips $versao" --notes "$notas" --target "$GITHUB_SHA" --latest; then
            # Um envio chegou entre a conferencia e a criacao: a volta dele
            # publica. Qualquer outro motivo e erro de verdade.
            ponta=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            if [ "$ponta" != "$GITHUB_SHA" ]; then
              echo "a main andou para ${ponta::7} no meio: a volta dela publica"
              gh release delete "ajudante-$versao" --cleanup-tag --yes 2>/dev/null || true
              exit 0
            fi
            exit 1
          fi
          echo "publicada: ajudante-$versao"
      # E nenhum rascunho: um `gh release create` que cai no meio do upload
      # deixa um para tras (o diagnostico de 24-set-2026 tambem deixou). As
      # voltas sao uma por vez, entao nenhum rascunho aqui e de outra em curso.
      - name: Guardar so as 5 mais novas, e nenhum rascunho
        run: |
          for id in $(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft) | .id'); do
            echo "apagando o rascunho $id"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("ajudante-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            echo "apagando $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
