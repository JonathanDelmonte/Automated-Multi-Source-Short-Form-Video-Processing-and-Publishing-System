name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Everything the collected tests import at module level, WITHOUT the
      # heavy ML stack (torch/ultralytics/mediapipe/faster-whisper) — the
      # pipeline modules import those lazily behind their feature gates, and
      # the tests exercise the gated-off paths. numpy+opencv cover the layout
      # modules, fastapi/python-multipart cover importing app.py for the MCP
      # endpoint tests, google-genai covers gemini_worker.
      # boto3, PyJWT e email-validator sairam com as dependencias pagas e com
      # o modulo cloud/ (ver docs/DECISOES.md, ADR-001). sqlalchemy e alembic
      # voltaram na Fase 0.5, agora para o schema proprio, com aiosqlite.
      - name: Install test dependencies
        run: >
          pip install pytest pillow httpx pydantic numpy
          opencv-python-headless python-dotenv google-genai fastapi
          python-multipart 'sqlalchemy[asyncio]' aiosqlite alembic
      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
