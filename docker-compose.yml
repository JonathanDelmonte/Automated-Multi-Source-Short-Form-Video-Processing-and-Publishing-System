# Teto para o log de cada container (22-set-2026). O log fica DENTRO do disco
# do Docker -- no Windows, um .vhdx que cresce e nao encolhe sozinho --, e o
# backend repete ali cada linha de todo job (o download inteiro do yt-dlp, a
# transcricao). Sem teto ele so crescia. Com este, sao no maximo 3 arquivos de
# 10 MB por container: o bastante para o `ver-log.bat` e para investigar o
# ultimo job. Os videos nunca passaram por aqui: ficam em output/, no disco da
# maquina.
x-log-com-teto: &log-com-teto
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: .
    container_name: virtu-clips-backend
    # `--reload` so aqui, no arquivo de desenvolvimento local: o `CMD` do
    # Dockerfile continua sem ele, que e o que producao roda. Com isto, editar
    # um `.py` passa a valer sozinho, como ja acontecia com `.jsx` no Vite --
    # some o `docker compose restart backend` depois de todo `git pull`.
    #
    # Os `--reload-exclude` nao sao enfeite: o repositorio inteiro e montado em
    # /app, entao o vigia enxerga `output/`, `uploads/` e `data/` -- exatamente
    # onde um job em andamento escreve. Um reload no meio de um render derruba a
    # fila em memoria e deixa o `main.py` orfao; o manifesto de resume recupera,
    # e nao deveria precisar.
    #
    # **Eles dependem do `watchfiles`** (fixado no requirements.txt por causa
    # disto). Sem ele o uvicorn 0.46 cai no `StatReload`, que registra em log
    # "--reload-include and --reload-exclude have no effect unless watchfiles is
    # installed" e varre a arvore toda a cada ciclo. O filtro `*.py` do
    # StatReload salvaria a correcao, mas a varredura sobre um `output/` que
    # cresce a cada job nao se salva sozinha.
    command: >
      uvicorn app:app --host 0.0.0.0 --port 8000
      --reload
      --reload-exclude 'output/*'
      --reload-exclude 'uploads/*'
      --reload-exclude 'data/*'
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped
    logging: *log-com-teto

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: virtu-clips-frontend
    ports:
      - "5175:5173"
    environment:
      # Sem isto, no Windows, um `git pull` de `.jsx` nao chega ao Vite: o bind
      # mount do Docker Desktop nao repassa os eventos do sistema de arquivos do
      # Windows para o inotify do Linux, e o dev server continua servindo o
      # grafo de modulos que leu quando o container subiu. O arquivo esta la
      # dentro; nada avisa. Custou uma aba inteira que "nao aparecia" enquanto o
      # backend ja respondia ao endpoint novo dela.
      #
      # A variavel esta so aqui, e nao no `vite.config.js`, porque polling
      # custa CPU e so e preciso dentro do container: `npm run dev` direto na
      # maquina recebe os eventos normalmente.
      - VITE_USE_POLLING=1
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    logging: *log-com-teto
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: virtu-clips-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    logging: *log-com-teto
    depends_on:
      - backend
