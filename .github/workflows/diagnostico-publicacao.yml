name: Diagnostico da publicacao

# Temporario (24-set-2026): o job `publicar` do windows.yml levou 403
# ("Resource not accessible by integration") ao criar a release, com o token
# mostrando `Contents: write`. Isto repete os dois passos -- criar a tag e
# criar a release -- imprimindo a resposta INTEIRA do GitHub, cabecalhos
# inclusive (o `X-Accepted-GitHub-Permissions` diz qual permissao faltou), e
# apaga o que tiver criado. So roda a mao.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tag e release de teste
        run: |
          tag="diagnostico-${GITHUB_RUN_ID}"
          echo "== o repositorio visto pelo token"
          gh api "repos/$GH_REPO" --jq '{permissions, visibility, owner: .owner.login}' || true
          echo "== criar a tag $tag em $GITHUB_SHA"
          gh api -i -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" || true
          echo "== criar um rascunho de release na tag"
          gh api -i -X POST "repos/$GH_REPO/releases" -f tag_name="$tag" -f name="$tag" -F draft=true || true
          echo "== criar um rascunho de release SEM tag existente (o que o gh release create faz)"
          gh api -i -X POST "repos/$GH_REPO/releases" -f tag_name="$tag-b" -f target_commitish="$GITHUB_SHA" -F draft=true || true
          echo "== limpar"
          for id in $(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name | startswith("diagnostico-")) | .id'); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id" || true
          done
          for t in "$tag" "$tag-b"; do
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" 2>/dev/null || true
          done
