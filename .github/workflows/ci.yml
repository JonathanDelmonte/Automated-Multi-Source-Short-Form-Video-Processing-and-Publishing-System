name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Everything the collected tests import at module level, WITHOUT the
      # heavy ML stack (torch/ultralytics/mediapipe/faster-whisper) — the
      # pipeline modules import those lazily behind their feature gates, and
      # the tests exercise the gated-off paths. numpy+opencv cover the layout
      # modules, fastapi/python-multipart cover importing app.py for the MCP
      # endpoint tests, google-genai covers gemini_worker.
      # boto3, PyJWT e email-validator sairam com as dependencias pagas e com
      # o modulo cloud/ (ver docs/DECISOES.md, ADR-001). sqlalchemy e alembic
      # voltaram na Fase 0.5, agora para o schema proprio, com aiosqlite.
      # imageio-ffmpeg traz um ffmpeg estatico dentro do pacote (22-set-2026):
      # e o que deixa `tests/test_render_numa_passada.py` conferir, quadro a
      # quadro, o render do reenquadramento aqui -- sem ele esses testes pulam.
      # Pelo pip e nao pelo apt: um espelho do apt fora do ar deixaria o CI
      # vermelho por um motivo que nao e do codigo.
      - name: Install test dependencies
        run: >
          pip install pytest pillow httpx pydantic numpy
          opencv-python-headless python-dotenv google-genai fastapi
          python-multipart 'sqlalchemy[asyncio]' aiosqlite alembic
          imageio-ffmpeg
      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      # O lint entrou em 17-set-2026, e entrou por um defeito que passou daqui.
      # O `build` resolve imports e checa sintaxe -- e nao ve uma `const` usada
      # antes da declaracao. Uma dessas, no array de dependencias de um
      # `useEffect` do `AuthContext` (avaliado durante o RENDER), matou o
      # provider que embrulha o app inteiro: o painel abriu em PRETO, sem
      # mensagem, e o CI aqui ficou verde. A regra `no-use-before-define` pega,
      # mas so se alguem rodar o lint.
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
